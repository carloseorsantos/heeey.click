# Runs on every PR and on main: type check + build, unit and database tests (PGlite, no
# real Supabase), and a dependency audit. Branch protection requires the "ci" check to pass.
# On PRs, once "ci" passes, the "staging" job merges the PR into `staging`; Vercel's Git integration
# deploys that branch to stg.heeey.click. Optional secret STAGING_PUSH_TOKEN (fine-grained PAT with
# Contents + Workflows write) lets it push PRs that touch .github/workflows, which GITHUB_TOKEN can't.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high
      - name: Type check and build
        run: npm run build
      - name: Tests (unit + database)
        run: npm test

  # After CI passes on a PR, merge it into `staging`. Vercel deploys the push to stg.heeey.click.
  # Skipped for forks and Dependabot, whose tokens can't push here.
  staging:
    needs: ci
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    # One staging update at a time; never cancel a merge halfway.
    concurrency:
      group: staging
      cancel-in-progress: false
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.STAGING_PUSH_TOKEN || github.token }}
      - name: Merge PR into staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin staging >/dev/null; then
            git fetch origin staging main "pull/$PR_NUMBER/head:pr-$PR_NUMBER"
            git switch -C staging origin/staging
            git merge --no-edit origin/main
          else
            git fetch origin main "pull/$PR_NUMBER/head:pr-$PR_NUMBER"
            git switch -C staging origin/main
          fi
          git merge --no-ff --no-edit -m "Merge PR #$PR_NUMBER into staging" "pr-$PR_NUMBER"
          git push origin staging
      - name: Comment staging URL on the PR
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- staging-deploy -->';
            const body = `${marker}\n🚀 Merged into \`staging\`. Vercel is deploying it to https://stg.heeey.click\n\nCommit: ${context.payload.pull_request.head.sha}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
