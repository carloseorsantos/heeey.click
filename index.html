<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heeey — Whiteboard Colaborativo</title>
    <meta name="description" content="Lousa interativa e quadro branco colaborativo em tempo real com Excalidraw e Supabase." />
    <!-- Preconnect fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Apply theme before first paint to avoid a light/dark flash
      try {
        var t = localStorage.getItem('heeey_theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased h-screen w-screen overflow-hidden">
    <div id="root" class="h-full w-full flex flex-col overflow-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
