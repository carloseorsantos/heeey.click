<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heeey — Whiteboard Colaborativo</title>
    <meta name="description" content="Lousa interativa e quadro branco colaborativo em tempo real com Excalidraw e Supabase." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0e10" />
    <script>
      // Excalidraw fonts are served from this site instead of esm.sh (see vite.config.ts)
      window.EXCALIDRAW_ASSET_PATH = '/excalidraw-assets/';
    </script>
    <script>
      // Language before first paint (the React app keeps it in sync afterwards, see src/i18n)
      try {
        var lang = (new URLSearchParams(location.search).get('lang') || localStorage.getItem('heeey_locale') || navigator.language || '').toLowerCase();
        var locale = /^en/.test(lang) ? 'en-US' : /^es/.test(lang) ? 'es-ES' : 'pt-BR';
        document.documentElement.lang = locale;
        document.title = { 'pt-BR': 'Heeey — Lousa colaborativa', 'en-US': 'Heeey — Collaborative whiteboard', 'es-ES': 'Heeey — Pizarra colaborativa' }[locale];
      } catch (e) {}
    </script>
    <script>
      // Apply theme before first paint to avoid a light/dark flash
      try {
        var t = localStorage.getItem('heeey_theme');
        if (t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-app text-label antialiased h-screen w-screen overflow-hidden">
    <div id="root" class="h-full w-full flex flex-col overflow-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
